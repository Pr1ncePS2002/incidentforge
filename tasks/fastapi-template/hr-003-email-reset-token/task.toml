schema_version = "1.4"

[metadata]
title = "reload password-reset link settings together at runtime"
family = "hot-reload-config"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["stale-capture: a reader holding the settings object from import time keeps the old token lifetime and host after a reload, unless the same object is updated in place", "invalid-reload: a reload supplies EMAIL_RESET_TOKEN_EXPIRE_HOURS of 0, -3, 721, 'abc', True or 3.0, or a FRONTEND_HOST such as 'localhost:5173' or 'ftp://...'; the reload must raise a ValueError naming the key and keep the last good pair", "partial-reload: a reload has a valid new value for one key and an invalid value for the other; neither key may change, and concurrent readers of get_password_reset_settings() must never see a mixed old/new pair", "reload-unset: a key is missing, None or blank on reload; it must fall back to its default (48 / http://localhost:5173), not keep the stale value"]
map_node = "backend/app/core/config.py::Settings"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
