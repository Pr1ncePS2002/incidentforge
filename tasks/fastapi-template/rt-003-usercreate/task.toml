schema_version = "1.4"

[metadata]
title = "lossless edit of user-creation draft files"
family = "config-round-trip"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["dropped-field: keys UserCreate does not know (team, quota, tags, meta) or untouched known fields disappear after editing another field", "default-overwrite: an absent field (is_active) gets written as its default, or an explicit default/null/empty value (is_superuser false, full_name null or empty string) is replaced or omitted", "type-drift: untouched ints/floats/lists/objects/bools change type, or a changed boolean field is stored as the string it was given", "partial-write: an invalid change or a failing os.replace leaves a modified/truncated draft or a stray temp file instead of the previous draft"]
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
