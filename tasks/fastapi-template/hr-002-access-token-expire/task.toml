schema_version = "1.4"

[metadata]
title = "reload token lifetimes at runtime without a restart"
family = "hot-reload-config"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
repo_url = "https://github.com/fastapi/full-stack-fastapi-template.git"
licence = "MIT"
fault_cases = ["stale-capture: after a reload, the login endpoint keeps issuing access tokens with the old ACCESS_TOKEN_EXPIRE_MINUTES (for example because a new Settings object was rebound instead of updating the shared one)", "invalid-reload: a reload with a non-integer, zero, negative, float or bool ACCESS_TOKEN_EXPIRE_MINUTES is rejected with a ValueError naming the key, and the last good value keeps serving", "partial-reload: a reload with a valid ACCESS_TOKEN_EXPIRE_MINUTES and an invalid EMAIL_RESET_TOKEN_EXPIRE_HOURS (or the other way round) must not apply the valid half", "reload-unset: a key that is missing, None or blank on reload falls back to the Settings default (11520 minutes / 48 hours) instead of keeping the stale runtime value"]
generator_backend = "claude-code"
map_node = "backend/app/core/config.py::Settings.ACCESS_TOKEN_EXPIRE_MINUTES"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
