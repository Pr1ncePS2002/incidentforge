schema_version = "1.4"

[metadata]
title = "record token checks once per idempotency key on retry"
family = "idempotent-consumer"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["duplicate-delivery: the same user sends POST /login/test-token twice (and five times) with the same Idempotency-Key; exactly one audit event is recorded and the repeats replay the original X-Token-Check-Id with Idempotency-Replayed: true", "back-to-back-duplicate: eight identical keyed requests are released together from a barrier before any of them returns; exactly one event is recorded, all eight report one check id and seven are marked as replayed", "distinct-events: different keys from one user, and the same key value from two different users, each record their own event and are not merged"]
map_node = "backend/app/api/routes/login.py::test_token"
blast_radius = 1

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
