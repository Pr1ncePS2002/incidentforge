schema_version = "1.4"

[metadata]
title = "derive per-worker connection pool overflow from the database connection budget"
family = "resource-aware-defaults"
difficulty = "hard"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["hardcoded-size: the engine keeps SQLAlchemy's fixed overflow of 10 instead of DB_MAX_CONNECTIONS // WEB_CONCURRENCY - DB_POOL_SIZE", "exceeds-limit: WEB_CONCURRENCY x DB_POOL_SIZE (or x (DB_POOL_SIZE + DB_MAX_OVERFLOW)) is greater than DB_MAX_CONNECTIONS", "zero-or-negative: WEB_CONCURRENCY, DB_POOL_SIZE or DB_MAX_CONNECTIONS below 1, or DB_MAX_OVERFLOW below 0", "unset-limit: DB_MAX_CONNECTIONS not configured; overflow must default to 2 x DB_POOL_SIZE"]

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
