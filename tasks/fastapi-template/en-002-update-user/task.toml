schema_version = "1.4"

[metadata]
title = "scope user change event topic and message key by the configured FASTAPI_ENV"
family = "env-aware-naming"
difficulty = "hard"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["unscoped-key: the user-updated topic or per-user message key is built without the FASTAPI_ENV prefix, so staging and production publish identical names", "wrong-env-source: names use a hardcoded or import-time 'development' environment instead of the FASTAPI_ENV configured on settings at call time", "unknown-env: FASTAPI_ENV is empty, None or not one of development/staging/production; scoped_name and update_user must raise ValueError naming FASTAPI_ENV before any write or publish", "separator-injection: a name part containing ':' (or empty) would make ('a:b','c') collide with ('a','b:c'); it must be rejected with ValueError"]

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
