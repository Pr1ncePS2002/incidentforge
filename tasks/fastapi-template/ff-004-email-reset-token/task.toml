schema_version = "1.4"

[metadata]
title = "refuse to start when email is enabled but password-recovery settings are unusable"
family = "fail-fast-config"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
repo_url = "https://github.com/fastapi/full-stack-fastapi-template.git"
licence = "MIT"
fault_cases = ["conditional-missing: SMTP_HOST set (email enabled) but EMAILS_FROM_EMAIL absent; SMTP_USER set without SMTP_PASSWORD", "empty: SMTP_HOST is whitespace-only, FRONTEND_HOST is whitespace-only, or SMTP_PASSWORD is blank while email is enabled", "placeholder: SMTP_PASSWORD left as changethis / TODO / <fill-me>, FRONTEND_HOST as <fill-me>, or SMTP_HOST as changethis", "several-bad: EMAILS_FROM_EMAIL missing, FRONTEND_HOST blank and SMTP_PASSWORD placeholder at once; the single error names all three"]
generator_backend = "claude-code"
map_node = "backend/app/core/config.py::Settings"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
