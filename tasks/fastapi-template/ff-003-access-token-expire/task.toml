schema_version = "1.4"

[metadata]
title = "reject unusable token lifetime settings at startup"
family = "fail-fast-config"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["empty: ACCESS_TOKEN_EXPIRE_MINUTES passed as a whitespace-only string, and EMAIL_RESET_TOKEN_EXPIRE_HOURS set to whitespace in the environment", "placeholder: ACCESS_TOKEN_EXPIRE_MINUTES left as changethis / TODO / <fill-me>, and EMAIL_RESET_TOKEN_EXPIRE_HOURS left as fixme in the environment", "several-bad: ACCESS_TOKEN_EXPIRE_MINUTES=0 with EMAIL_RESET_TOKEN_EXPIRE_HOURS=-5, and a placeholder access lifetime with a zero reset lifetime; one error must name both keys"]

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
