schema_version = "1.4"

[metadata]
title = "make item creation safe to retry with an idempotency-key header"
family = "idempotent-consumer"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
repo_url = "https://github.com/fastapi/full-stack-fastapi-template.git"
licence = "MIT"
fault_cases = ["duplicate-delivery: the same POST /items/ is sent three times with the same Idempotency-Key and payload; exactly one item exists and every response carries the original item", "retry-after-partial: the first attempt's commit lands but the connection drops before the response (500); the retry with the same key returns that item and no second row is created", "retry-after-partial: the first attempt flushes the item but fails before committing (500); nothing persists, and the retries create exactly one item", "back-to-back-duplicate: two requests with the same user and key run at the same time on separate sessions; exactly one item is created and both get it back", "distinct-events: two requests with identical payloads but different keys both create items, and replaying one key returns its own item"]
generator_backend = "claude-code"
map_node = "backend/app/api/routes/items.py::create_item#handler"
blast_radius = 2
fix_scope = "2-3 files"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
