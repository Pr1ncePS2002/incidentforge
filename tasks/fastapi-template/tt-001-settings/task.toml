schema_version = "1.4"

[metadata]
title = "accept unit-suffixed durations for token expiry settings"
family = "tolerant-typed-config"
difficulty = "easy"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
repo_url = "https://github.com/fastapi/full-stack-fastapi-template.git"
licence = "MIT"
fault_cases = ["duration-suffix: ACCESS_TOKEN_EXPIRE_MINUTES / EMAIL_RESET_TOKEN_EXPIRE_HOURS written as \"30m\", \"2h\", \"1d\", \"120s\", \"8D\", \" 45 M \" via kwargs and env must convert to the same int as the canonical form", "garbage: values like \"abc\", \"5x\", \"1.5h\", \"30 minutes\", \"2w\", or non-whole conversions (\"30s\" for minutes, \"90m\" for hours) must raise at Settings construction naming the key and the bad value"]
generator_backend = "claude-code"
map_node = "backend/app/core/config.py::Settings.ACCESS_TOKEN_EXPIRE_MINUTES"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
