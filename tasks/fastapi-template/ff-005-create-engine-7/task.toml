schema_version = "1.4"

[metadata]
title = "refuse to start with unauthenticated or half-configured database settings"
family = "fail-fast-config"
difficulty = "medium"
origin = "postmortem"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["missing: DATABASE_URL carries no password (or no user and no password), so the engine would connect unauthenticated", "empty: DATABASE_URL password is empty or whitespace-only; DATABASE_SSL_ROOT_CERT is empty or whitespace while DATABASE_SSL_ENABLED is on", "placeholder: DATABASE_SSL_ROOT_CERT left as changethis, TODO or <fill-me> while DATABASE_SSL_ENABLED is on", "conditional-missing: DATABASE_SSL_ENABLED is on (via kwargs or the environment) but DATABASE_SSL_ROOT_CERT is absent", "several-bad: a DATABASE_URL with no password plus SSL enabled with no root cert; one error must name both DATABASE_URL and DATABASE_SSL_ROOT_CERT"]
map_node = "backend/app/core/config.py::Settings"
blast_radius = 4
fix_scope = "4+ files"
source_url = "https://www.heroku.com/blog/how-i-broke-git-push-heroku-main"
classifier_family = "fail-fast-config"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
