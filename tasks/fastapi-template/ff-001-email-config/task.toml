schema_version = "1.4"

[metadata]
title = "fail fast on a half-configured mailer"
family = "fail-fast-config"
difficulty = "hard"
origin = "hand-written"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["SMTP_HOST set without EMAILS_FROM_EMAIL", "SMTP_USER without SMTP_PASSWORD", "SMTP_PASSWORD without SMTP_USER", "SMTP_TLS and SMTP_SSL both true", "SMTP_PORT outside 1-65535", "several faults at once reported in one error"]
map_node = "backend/app/core/config.py::Settings"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
