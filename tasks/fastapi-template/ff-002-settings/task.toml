schema_version = "1.4"

[metadata]
title = "reject blank or placeholder core settings at startup"
family = "fail-fast-config"
difficulty = "medium"
origin = "llm"
target = "fastapi-template"
base_commit = "77e550a73bb49dd2967622c5ed11bf7a49603c93"
fault_cases = ["empty: SECRET_KEY, PROJECT_NAME or FIRST_SUPERUSER_PASSWORD set to an empty or whitespace-only string", "placeholder: SECRET_KEY, PROJECT_NAME or FIRST_SUPERUSER_PASSWORD set to todo, tbd, fixme, changeme, replace-me, xxx or <fill-me> (ignoring case and surrounding whitespace)", "several-bad: two or three of these settings are bad at once and the single error names every one of them"]

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
