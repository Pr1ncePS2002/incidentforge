schema_version = "1.4"

[metadata]
title = "scope google reader subscription names to the deployment environment"
family = "env-aware-naming"
difficulty = "medium"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
repo_url = "https://github.com/miniflux/v2.git"
licence = "Apache-2.0"
fault_cases = ["unscoped-key: subscription name built without the environment prefix, so staging and production produce the same name", "wrong-env-source: name built from a hardcoded/default environment instead of the MINIFLUX_ENVIRONMENT setting", "unknown-env: MINIFLUX_ENVIRONMENT empty, whitespace or not one of production/staging/development/test must fail with an error naming the setting", "separator-injection: a feed URL or part containing ':' must be escaped so it cannot collide with a name built from separate parts"]
generator_backend = "claude-code"
map_node = "internal/googlereader/handler.go::subscribe"
blast_radius = 2
fix_scope = "2-3 files"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
