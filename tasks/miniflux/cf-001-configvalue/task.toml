schema_version = "1.4"

[metadata]
title = "reject inverted scheduler interval range and conflicting tls certificate modes"
family = "cross-field-validation"
difficulty = "medium"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
fault_cases = ["inverted-range: SCHEDULER_ENTRY_FREQUENCY_MIN_INTERVAL set above SCHEDULER_ENTRY_FREQUENCY_MAX_INTERVAL (explicitly, or above the default max)", "mutually-exclusive: CERT_DOMAIN (autocert) set together with CERT_FILE and/or KEY_FILE (manual certificates)", "boundary-equal: min one minute above max is rejected while min == max is accepted"]

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
