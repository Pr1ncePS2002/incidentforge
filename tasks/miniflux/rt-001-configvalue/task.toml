schema_version = "1.4"

[metadata]
title = "lossless in-place updates of the miniflux configuration file"
family = "config-round-trip"
difficulty = "easy"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
fault_cases = ["dropped-field: comments, blank lines, unknown keys or untouched settings disappear when one key is set or unset", "default-overwrite: an explicit value equal to the default (LOG_LEVEL=info) or an explicit empty value (ADMIN_USERNAME=) is omitted or treated as unset", "partial-write: a rejected update (line-break injection, invalid key, untrimmable value, set+unset conflict) modifies the file or leaves temporary files behind"]
map_node = "internal/config/options.go::configValue"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
