schema_version = "1.4"

[metadata]
title = "fail fast when admin bootstrap credentials are missing"
family = "fail-fast-config"
difficulty = "medium"
origin = "hand-written"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
repo_url = "https://github.com/miniflux/v2.git"
licence = "Apache-2.0"
fault_cases = ["conditional-missing: CREATE_ADMIN on without ADMIN_USERNAME", "conditional-missing: CREATE_ADMIN on without ADMIN_PASSWORD", "empty: ADMIN_USERNAME set to whitespace only", "several-bad: CREATE_ADMIN on with no credentials, error names both keys"]
map_node = "internal/config/parser.go::configParser"
blast_radius = 3
fix_scope = "2-3 files"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
