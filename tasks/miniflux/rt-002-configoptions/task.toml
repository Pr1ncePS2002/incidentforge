schema_version = "1.4"

[metadata]
title = "lossless export of environment settings into the miniflux configuration file"
family = "config-round-trip"
difficulty = "medium"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
repo_url = "https://github.com/miniflux/v2.git"
licence = "Apache-2.0"
fault_cases = ["dropped-field: comments, blank lines, unknown keys and settings not in the environment disappear when the environment is merged into the config file", "default-overwrite: a setting equal to its default or explicitly empty (OAUTH2_CLIENT_ID=) is omitted or keeps the old value instead of being written as KEY=", "type-drift: values are normalised on write (RUN_MIGRATIONS=yes rewritten as true/1) instead of kept verbatim", "partial-write: an export with an unwritable value (line break) truncates or mixes the previous file or leaves temporary files behind"]
generator_backend = "claude-code"
map_node = "internal/config/options.go::configOptions"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
