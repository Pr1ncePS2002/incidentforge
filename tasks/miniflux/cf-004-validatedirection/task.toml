schema_version = "1.4"

[metadata]
title = "reject empty or inverted entry query windows in the validator"
family = "cross-field-validation"
difficulty = "easy"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
repo_url = "https://github.com/miniflux/v2.git"
licence = "Apache-2.0"
fault_cases = ["inverted-range: published_after/changed_after/after_entry_id/after greater than its matching before bound is accepted and returns an empty list", "boundary-equal: equal lower and upper bounds (exclusive on both ends) describe an empty range and must be rejected, naming both parameters", "negative-or-zero: a negative entry ID or timestamp bound is accepted and silently ignored instead of rejected"]
generator_backend = "claude-code"
map_node = "internal/validator/validator.go::ValidateDirection"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
