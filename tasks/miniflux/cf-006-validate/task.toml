schema_version = "1.4"

[metadata]
title = "reject impossible credential length policies for the login form"
family = "cross-field-validation"
difficulty = "easy"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
fault_cases = ["inverted-range: MinUsernameLength or MinPasswordLength set greater than its matching Max, rejected with both field names", "negative-or-zero: any of the four length limits set to 0 or -1, rejected naming that field", "boundary-equal: Min == Max is allowed and enforces an exact length counted in characters"]
map_node = "internal/ui/form/auth.go::authForm.Validate"
blast_radius = 1
fix_scope = "1 file"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
