schema_version = "1.4"

[metadata]
title = "fail fast on incomplete or placeholder tls certificate settings"
family = "fail-fast-config"
difficulty = "medium"
origin = "llm"
target = "miniflux"
base_commit = "b31f7867f4a1ad9b4abfcebd376c94cecf5f1942"
fault_cases = ["conditional-missing: CERT_FILE set while KEY_FILE is absent (and the reverse), which today silently falls back to plain HTTP", "empty: KEY_FILE set to whitespace only while CERT_FILE is set", "placeholder: CERT_FILE left as changethis / TODO / <fill-me> / ChangeMe, or KEY_FILE left as xxx", "several-bad: CERT_FILE=<fill-me> and KEY_FILE=todo together, or CERT_FILE=changethis with KEY_FILE missing; one error must name both keys"]
map_node = "internal/config/parser.go::configParser"
blast_radius = 4
fix_scope = "4+ files"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
