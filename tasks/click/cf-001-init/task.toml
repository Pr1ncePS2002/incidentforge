schema_version = "1.4"

[metadata]
title = "reject impossible nargs declarations on parameters"
family = "cross-field-validation"
difficulty = "easy"
origin = "llm"
target = "click"
base_commit = "cf19179e8e2fd54c601378cec9e0d21bb12b6fb1"
repo_url = "https://github.com/pallets/click.git"
licence = "BSD-3-Clause"
fault_cases = ["negative-or-zero: click.Option(['--pairs'], nargs=-2) and @click.argument('files', nargs=-3) raise ValueError mentioning 'nargs' and the bad value", "mutually-exclusive: click.Option(['--item'], multiple=True, nargs=-1) and the matching @click.option raise ValueError naming both 'multiple' and 'nargs'"]
generator_backend = "claude-code"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
