schema_version = "1.4"

[metadata]
title = "reject environment variable names that are empty or contain separator characters"
family = "env-aware-naming"
difficulty = "easy"
origin = "llm"
target = "click"
base_commit = "cf19179e8e2fd54c601378cec9e0d21bb12b6fb1"
repo_url = "https://github.com/pallets/click.git"
licence = "BSD-3-Clause"
fault_cases = ["unknown-env: an empty entry in an envvar list (['', 'APP_TOKEN'] or ['APP_TOKEN', '']) is rejected with a ValueError naming 'envvar', the empty name and the parameter 'token'", "separator-injection: an envvar name containing '=' ('STG=PRD') is rejected with a ValueError naming the name and the parameter", "separator-injection: an envvar name containing whitespace ('APP TOKEN', 'BAD\\tTOKEN', or 'SRC PATH' on an argument) is rejected instead of silently reading an unexportable variable"]
generator_backend = "claude-code"

[verifier]
timeout_sec = 900.0
environment_mode = "shared"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
