[project]
name = "incidentforge"
version = "0.1.0"
description = "coding task factory: feature tasks forged from real production failure classes"
readme = "README.md"
authors = [
    { name = "Prince Singh", email = "psingh80436@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai==3.5.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "typer==0.29.1",
]

[project.scripts]
forge = "incidentforge.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
