# enforces ftr/* -> develop -> main; required status check on both protected branches
name: branch-flow

on:
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  source-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ]; then
            echo "::error::only develop may open a PR into main (got '$HEAD')"
            exit 1
          fi
          if [ "$BASE" = "develop" ] && [[ "$HEAD" != ftr/* ]]; then
            echo "::error::PRs into develop must come from ftr/* (got '$HEAD')"
            exit 1
          fi
          echo "ok: $HEAD -> $BASE"
